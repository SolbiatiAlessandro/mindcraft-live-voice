<!doctype html><meta charset="utf-8"><title>Talk to Badcock (live)</title>
<style>body{font:16px system-ui;max-width:600px;margin:40px auto;padding:0 16px}button{font-size:20px;padding:12px 22px}.dim{color:#888}#log div{margin:5px 0}.tool{color:#06c}.me{font-weight:600}</style>
<h2>Talk to Badcock</h2>
<button id="b">Start talking</button> <span id="st" class="dim">off</span> · body: <span id="body" class="dim">?</span>
<p class="dim">Leave this tab open and go back to Minecraft. Just talk; you can talk over him. Headphones give the best result. Hang up when done (billed per minute).</p>
<div id="log"></div><audio id="au" autoplay></audio>
<script>
let pc=null,dc=null,mic=null,ready=false,frags=[],lastReq='',n=0;
const lines={me:null,bot:null},timers={};
const $=id=>document.getElementById(id),st=s=>$('st').textContent=s;
const log=(t,c)=>{const d=document.createElement('div');d.textContent=t;if(c)d.className=c;$('log').prepend(d);return d};
const send=o=>{if(dc&&dc.readyState==='open')dc.send(JSON.stringify(o))};
// captions: each speaker's line keeps growing until 1.5 s of silence
function caption(who,label,delta,cls){if(!lines[who])lines[who]=log(label,cls);lines[who].textContent+=delta;clearTimeout(timers[who]);timers[who]=setTimeout(()=>{lines[who]=null},1500)}
// the player's latest utterance = trailing fragments with no gap longer than 2 s
function lastUtterance(){let i=frags.length-1;while(i>0&&frags[i].start_ms-frags[i-1].end_ms<2000)i--;const t=frags.slice(Math.max(i,0)).map(f=>f.delta).join('').trim();frags=[];return t}
const say=(text,id)=>send({type:'session.commentary.append',event_id:'r'+Date.now()+'_'+(n++),delegation_id:id||null,content:String(text||'(no reply)').slice(0,1500)});
const es=new EventSource('/events');
es.addEventListener('status',e=>{$('body').textContent=JSON.parse(e.data).inGame?'in game':'offline'});
es.addEventListener('update',e=>{const t=JSON.parse(e.data).text;log('body update: '+t,'tool');if(ready)say(t,null)});
async function onEvent(ev){
 if(ev.type==='session.started'){ready=true;st('live — just talk')}
 else if(ev.type==='session.input_transcript.delta'){frags.push(ev);caption('me','you: ',ev.delta,'me')}
 else if(ev.type==='session.output_transcript.delta')caption('bot','Badcock: ',ev.delta)
 else if(ev.type==='session.closed'){log('session closed: '+ev.reason+', '+(ev.usage&&ev.usage.seconds)+' s','dim');stop('off',true)}
 else if(ev.type==='error')log('error: '+JSON.stringify(ev.error||ev).slice(0,300),'dim');
 else if(ev.type==='session.delegation.created'){
  const id=ev.delegation.id;await new Promise(r=>setTimeout(r,900)); // let the last transcript fragments land
  const request=lastUtterance()||lastReq;lastReq=request;
  log('→ body: '+request,'tool');let result;
  try{result=(await(await fetch('/tell',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({request})})).json()).result}catch(e){result='Could not reach the body: '+e.message}
  log('← body: '+result,'tool');say(result,id)}
 else console.log(ev);
}
async function start(){
 st('connecting…');mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
 pc=new RTCPeerConnection();pc.ontrack=e=>{$('au').srcObject=e.streams[0]};mic.getTracks().forEach(t=>pc.addTrack(t,mic));
 dc=pc.createDataChannel('oai-events');dc.onmessage=e=>onEvent(JSON.parse(e.data));dc.onopen=()=>st('connected, starting…');
 pc.onconnectionstatechange=()=>{if(pc&&['failed','closed','disconnected'].includes(pc.connectionState))stop('connection '+pc.connectionState,true)};
 await pc.setLocalDescription(await pc.createOffer());
 if(pc.iceGatheringState!=='complete')await new Promise(r=>{const t=setTimeout(r,5000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);r()}})});
 const r=await fetch('/offer',{method:'POST',headers:{'content-type':'application/sdp'},body:pc.localDescription.sdp});
 if(!r.ok){stop('failed',true);log('error: '+await r.text(),'dim');return}
 await pc.setRemoteDescription({type:'answer',sdp:await r.text()});$('b').textContent='Hang up'}
function stop(why,now){
 if(!now&&ready){send({type:'session.close'});st('closing…');setTimeout(()=>{if(pc)stop(why,true)},2500);return} // wait for session.closed so billing stops cleanly
 if(mic)mic.getTracks().forEach(t=>t.stop());if(pc)pc.close();pc=dc=mic=null;ready=false;frags=[];$('b').textContent='Start talking';st(why||'off')}
$('b').onclick=()=>pc?stop():start().catch(e=>{stop('failed',true);log('error: '+e.message,'dim')});
</script>
