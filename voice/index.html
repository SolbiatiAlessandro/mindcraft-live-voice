<!doctype html><meta charset="utf-8"><title>Talk to Badcock</title>
<style>body{font:16px system-ui;max-width:560px;margin:40px auto;padding:0 16px}button{font-size:20px;padding:12px 22px}#lvl{height:10px;background:#3a7;width:0}#bar{background:#ddd;margin:12px 0}#log div{margin:4px 0}.dim{color:#888}</style>
<h2>Talk to Badcock</h2>
<button id="b">Start listening</button> <span id="st" class="dim">off</span>
<div id="bar"><div id="lvl"></div></div>
<label class="dim">Sensitivity <input id="thr" type="range" min="0.005" max="0.08" step="0.005" value="0.02"></label>
<p class="dim">Leave this tab open and go back to Minecraft. Speak, then pause about a second. Listening pauses while Badcock is speaking.</p>
<div id="log"></div>
<script>
let on=false,stream,ctx,an,rec=null,chunks=[],t0=0,lastVoice=0,hot=0,tainted=false,busy=false;
const $=id=>document.getElementById(id), st=s=>$('st').textContent=s;
const log=(t,c)=>{const d=document.createElement('div');d.textContent=t;if(c)d.className=c;$('log').prepend(d)};
setInterval(async()=>{try{const j=await(await fetch('/busy')).json();busy=j.busy;if(busy&&rec)tainted=true;if(on&&!rec)st(busy?'Badcock speaking…':j.agent?'listening':'Mindcraft not connected')}catch{st('local server down')}},300);
function stop(){if(rec&&rec.state!=='inactive')rec.stop()}
function start(){chunks=[];tainted=busy;t0=lastVoice=performance.now();rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=async()=>{const dur=performance.now()-t0,type=rec.mimeType,bad=tainted;rec=null;if(bad||dur<1300)return;st('transcribing…');
  try{const j=await(await fetch('/say',{method:'POST',headers:{'content-type':type},body:new Blob(chunks,{type})})).json();log(j.error?('error: '+j.error):j.sent?('you: '+j.text):('(ignored) '+j.text),j.sent?'':'dim')}catch(e){log('error: '+e.message,'dim')}};
 rec.start();st('hearing you…')}
function tick(){if(!on)return;const a=new Float32Array(an.fftSize);an.getFloatTimeDomainData(a);let s=0;for(const v of a)s+=v*v;const rms=Math.sqrt(s/a.length),thr=+$('thr').value,now=performance.now();
 $('lvl').style.width=Math.min(100,rms*800)+'%';$('lvl').style.background=rms>thr?'#3a7':'#999';
 if(busy){stop();hot=0;return}
 if(!rec){hot=rms>thr?hot+1:0;if(hot>=2)start()}else{if(rms>thr)lastVoice=now;if(now-lastVoice>900||now-t0>20000)stop()}}
$('b').onclick=async()=>{if(on){on=false;stop();stream.getTracks().forEach(t=>t.stop());$('b').textContent='Start listening';st('off');return}
 stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});ctx=new AudioContext();an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(stream).connect(an);
 on=true;$('b').textContent='Stop';st('listening');setInterval(tick,50)};
</script>
